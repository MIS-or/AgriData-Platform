name: AgriData Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Typecheck, 53 Automated Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Strict Typecheck
        run: pnpm typecheck

      - name: Run 53 Automated Tests (Contracts & Edge API)
        run: pnpm test

      - name: Build All Workspaces (Vite PWA & Wrangler Bundler)
        run: pnpm build
