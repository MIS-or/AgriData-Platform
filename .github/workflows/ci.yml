name: AgriData Platform Production CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  # ------------------------------------------------------------------
  # STAGE 1: Secret Isolation, Single Root .env & Module Boundary Audit
  # ------------------------------------------------------------------
  architecture-and-secret-audit:
    name: Secret Isolation & Modular Boundary Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Single Root .env Policy, Zero Secret Leaks & Module Boundaries
        run: node scripts/verify-architecture.mjs

  # ------------------------------------------------------------------
  # STAGE 2: Typecheck, 55+ Unit/Integration Tests & 3-Tier DB Schema Test
  # ------------------------------------------------------------------
  test-and-build:
    name: Typecheck, Automated Tests & Production Build
    runs-on: ubuntu-latest
    needs: architecture-and-secret-audit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agridata_ci
          POSTGRES_PASSWORD: agridata_ci_ephemeral_pwd
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Verify 3-Tier Data Warehouse SQL Schema (Raw / Clean / Marts)
        env:
          PGPASSWORD: agridata_ci_ephemeral_pwd
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          psql -h localhost -U agridata_ci -d neondb -f apps/api/src/core/database/schema.sql

      - name: Strict TypeScript Check Across Workspaces
        run: pnpm typecheck

      - name: Run All Unit & Module Boundary Tests
        run: pnpm test

      - name: Build Production Artifacts (Contracts, Web PWA & Edge Worker)
        run: pnpm build

  # ------------------------------------------------------------------
  # STAGE 3: Multi-Stage Docker Build Verification
  # ------------------------------------------------------------------
  docker-packaging-verify:
    name: Verify Multi-Stage Docker Build
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - name: Build Isolated Docker Test & Web Runner Images
        run: |
          docker build --target test -t agridata-platform:test .
          docker build --target web-runner -t agridata-platform:web .
          docker build --target api-runner -t agridata-platform:api .

  # ------------------------------------------------------------------
  # STAGE 4: Automated Production Deployment (Cloudflare Free Tier)
  # ------------------------------------------------------------------
  deploy-production:
    name: Deploy to Cloudflare Workers & Pages
    runs-on: ubuntu-latest
    needs: [test-and-build, docker-packaging-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install & Build Production Bundles
        run: pnpm install --frozen-lockfile=false && pnpm build

      - name: Deploy Edge API & Frontend (When Cloudflare Secrets Configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            pnpm deploy:worker
            pnpm deploy:pages
          else
            echo "Skipping remote Cloudflare deployment: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set in GitHub Actions Secrets."
          fi
